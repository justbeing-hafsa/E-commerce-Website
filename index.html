<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-commerce Website</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <!-- 1. Logo + Brand -->
    <div class="brand-logo">
      <img src="logo-symbol.svg" alt="Logo" class="logo">
      <img src="Brand.svg" alt="Brand" class="brand-text">
    </div>

    <!-- 2. Search Bar -->
    <div class="search-form">
      <input type="text" placeholder="Search" class="search-input">
      <select class="search-category">
        <option>All category</option>
        <!-- Add more options if needed -->
      </select>
      <button class="search-button">Search</button>
    </div>

    <!-- 3. Action Icons -->
    <div class="header-actions">
      <div class="action">
        <img src="vector.svg" alt="Profile">
        <p>Profile</p>
      </div>
      <div class="action">
        <img src="Vector 1.svg" alt="Message">
        <p>Message</p>
      </div>
      <div class="action">
        <img src="Vector 2.svg" alt="Orders">
        <p>Orders</p>
      </div>
      <div class="action">
        <img src="Vector 3.svg" alt="My Cart">
        <p>My Cart</p>
      </div>
    </div>
  </header>
<footer class="footer">
  <div class="footer-container">
    <div class="footer-brand">
      <img src="logo-symbol.svg" alt="Logo" class="footer-logo" />
      <img src="Brand.svg" alt="Brand Text" class="footer-brand-text" />
      <p>Best information about the company lies here</p>
      
    </div>
    <div class="footer-icons">
  <img src="facebook3.svg" >
  <img src="twitter3.svg" >
  <img src="linkedin3.svg" >
  <img src="instagram3.svg" >
</div> 

    <div class="footer-links">
        
      <div class="footer-column">
        <h4>About</h4>
        <ul>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Find store</a></li>
          <li><a href="#">Categories</a></li>
        </ul>
      </div>

      <div class="footer-column">
        <h4>Information</h4>
        <ul>
          <li><a href="#">Help Center</a></li>
          <li><a href="#">Shipping</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </div>

      <div class="footer-column">
        <h4>For Users</h4>
        <ul>
          <li><a href="#">Login</a></li>
          <li><a href="#">Register</a></li>
          <li><a href="#">My settings</a></li>
        </ul>
      </div>
<div class="footer-column app-download">
  <h5>Get app</h5>
  <div class="app-buttons">
    <a href="#">
      <img src="market-button 1.svg" alt="Download on App Store" class="app-btn" />
    </a>
    <a href="#">
      <img src="market-button 0.svg" alt="Get it on Google Play" class="app-btn" />
    </a>
  </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2025 Ecommerce Brand. All rights reserved.</p>
    </div>
  </div>
</footer>

</body>
</html>
